<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PK Management web cabinet for castings, profiles, selections, chats and admin tools.">
  <meta name="theme-color" content="#020202">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PK Management">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PK Management</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #e7e7e7; }
    /* Startup loader — matches the Flutter splash (dark gradient, red glow, logo, wordmark)
       so the hand-off from HTML to the app is seamless. */
    #app-loading {
      --loader-red: #b00000;
      align-items: center;
      background:
        radial-gradient(72% 72% at 50% 59%, rgba(176, 0, 0, 0.34) 0%, rgba(176, 0, 0, 0) 100%),
        linear-gradient(180deg, #020202 0%, #140507 46%, #42000a 78%, #760012 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      font: 500 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      inset: 0;
      justify-content: center;
      margin: 0 auto;
      max-width: 1440px;
      padding: 24px;
      position: fixed;
      text-align: center;
      z-index: 10;
    }
    #app-loading-logo {
      align-items: center;
      animation: loader-pop 1.3s cubic-bezier(.2, .8, .3, 1.2) both;
      background: rgba(0, 0, 0, 0.32);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 50%;
      box-shadow: 0 0 42px 8px rgba(176, 0, 0, 0.46);
      box-sizing: border-box;
      display: flex;
      height: 132px;
      justify-content: center;
      margin-bottom: 36px;
      padding: 18px;
      width: 132px;
    }
    #app-loading-logo img {
      height: 100%;
      width: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }
    @keyframes loader-pop {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: none; }
    }
    #app-loading-bar {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      height: 2px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
      width: 132px;
    }
    #app-loading-bar::after {
      animation: loading-slide 1.4s cubic-bezier(.4, 0, .2, 1) infinite;
      background: #ff2a2a;
      border-radius: 2px;
      content: '';
      height: 100%;
      left: 0;
      position: absolute;
      top: 0;
      width: 40%;
    }
    @keyframes loading-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }
    #app-loading-text {
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
      letter-spacing: .4px;
      margin: 0;
      max-width: 340px;
    }
    #app-loading-retry {
      background: #fff;
      border: 0;
      border-radius: 999px;
      color: #1f1f1f;
      cursor: pointer;
      display: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .3px;
      line-height: 1;
      margin-top: 22px;
      padding: 14px 30px;
    }
    #app-loading-retry:hover { background: #f0f0f0; }
    #app-loading-brand {
      bottom: 48px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 18px;
      font-weight: 800;
      left: 24px;
      letter-spacing: 3.4px;
      position: absolute;
      right: 24px;
      text-transform: uppercase;
    }
    #app-loading.is-failed #app-loading-bar { display: none; }
    #app-loading.is-failed #app-loading-text { color: rgba(255, 255, 255, 0.86); }
    #app-loading.is-failed #app-loading-retry { display: inline-block; }
    @media (prefers-reduced-motion: reduce) {
      #app-loading-logo { animation: none; }
      #app-loading-bar::after { animation: none; width: 100%; opacity: .6; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div id="app-loading-logo"><img src="logo-144.png" alt="PK Management" width="96" height="96"></div>
    <div id="app-loading-bar"></div>
    <p id="app-loading-text">Загружаем кабинет…</p>
    <button id="app-loading-retry" type="button">Обновить страницу</button>
    <div id="app-loading-brand" aria-hidden="true">PK Management</div>
  </div>
  <script>
    (function () {
      var LOAD_TIMEOUT_MS = 20000;
      var SLOW_HINT_MS = 8000;
      var loading = document.getElementById('app-loading');
      var text = document.getElementById('app-loading-text');
      var retry = document.getElementById('app-loading-retry');
      var done = false;

      function finish() {
        if (done) return;
        done = true;
        clearTimeout(slowTimer);
        clearTimeout(failTimer);
        window.removeEventListener('error', onResourceError, true);
        window.removeEventListener('unhandledrejection', onRejection);
        observer.disconnect();
        if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
      }

      function fail(reason) {
        if (done || loading.classList.contains('is-failed')) return;
        clearTimeout(slowTimer);
        clearTimeout(failTimer);
        loading.classList.add('is-failed');
        text.textContent = 'Не удалось загрузить приложение. Проверьте подключение к интернету и попробуйте ещё раз.';
        if (reason && window.console) console.warn('[app-loading] ' + reason);
      }

      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view')) finish();
      });
      observer.observe(document.body, { childList: true, subtree: true });

      var slowTimer = setTimeout(function () {
        if (!done) text.textContent = 'Загрузка идёт дольше обычного…';
      }, SLOW_HINT_MS);

      var failTimer = setTimeout(function () {
        fail('timeout after ' + LOAD_TIMEOUT_MS + ' ms');
      }, LOAD_TIMEOUT_MS);

      // A script or wasm file that failed to download (CDN blocked, offline).
      function onResourceError(event) {
        var target = event.target;
        if (target && target.tagName === 'SCRIPT') fail('script failed: ' + target.src);
      }
      // flutter_bootstrap.js reports fetch failures as rejected promises.
      function onRejection(event) {
        var message = String(event.reason && event.reason.message || event.reason || '');
        if (/failed to fetch|networkerror|load failed/i.test(message)) fail('fetch failed: ' + message);
      }
      window.addEventListener('error', onResourceError, true);
      window.addEventListener('unhandledrejection', onRejection);

      retry.addEventListener('click', function () {
        retry.disabled = true;
        window.location.reload();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
