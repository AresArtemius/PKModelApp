name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Issues are re-emitted as GitHub annotations so they show up in the
        # checks UI and the API, not only in the raw log.
        run: |
          set -o pipefail
          status=0
          flutter analyze 2>&1 | tee analyze.txt || status=$?
          # grep returns 1 when there are no issues; that must not fail the step.
          (grep -E '^\s*(error|warning|info) •' analyze.txt || true) | while IFS= read -r line; do
            level=$(echo "$line" | sed -E 's/^\s*(error|warning|info) •.*/\1/')
            msg=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\2 (\6)/')
            file=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\3/')
            ln=$(echo "$line" | sed -E 's/^\s*(error|warning|info) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • (.*)$/\4/')
            [ "$level" = "info" ] && level=notice
            echo "::${level} file=${file},line=${ln}::${msg}"
          done
          exit $status

      - name: Test
        run: flutter test
