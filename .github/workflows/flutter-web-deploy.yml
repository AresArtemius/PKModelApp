name: Flutter Web Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
  FIREBASE_WEB_AUTH_DOMAIN: ${{ secrets.FIREBASE_WEB_AUTH_DOMAIN }}
  FIREBASE_WEB_PROJECT_ID: ${{ secrets.FIREBASE_WEB_PROJECT_ID }}
  FIREBASE_WEB_STORAGE_BUCKET: ${{ secrets.FIREBASE_WEB_STORAGE_BUCKET }}
  FIREBASE_WEB_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_WEB_MESSAGING_SENDER_ID }}
  FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
  FIREBASE_WEB_MEASUREMENT_ID: ${{ secrets.FIREBASE_WEB_MEASUREMENT_ID }}
  FIREBASE_WEB_VAPID_KEY: ${{ secrets.FIREBASE_WEB_VAPID_KEY }}

jobs:
  build:
    name: Build Flutter Web
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.upload-pages.outputs.artifact_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate web secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing GitHub secrets: SUPABASE_URL and/or SUPABASE_ANON_KEY."
            exit 1
          fi

      - name: Prepare Firebase Web push config
        run: |
          if [ -n "$FIREBASE_WEB_API_KEY" ] &&
             [ -n "$FIREBASE_WEB_AUTH_DOMAIN" ] &&
             [ -n "$FIREBASE_WEB_PROJECT_ID" ] &&
             [ -n "$FIREBASE_WEB_STORAGE_BUCKET" ] &&
             [ -n "$FIREBASE_WEB_MESSAGING_SENDER_ID" ] &&
             [ -n "$FIREBASE_WEB_APP_ID" ]; then
            printf '%s\n' \
              'self.firebaseWebConfig = {' \
              "  apiKey: \"$FIREBASE_WEB_API_KEY\"," \
              "  authDomain: \"$FIREBASE_WEB_AUTH_DOMAIN\"," \
              "  projectId: \"$FIREBASE_WEB_PROJECT_ID\"," \
              "  storageBucket: \"$FIREBASE_WEB_STORAGE_BUCKET\"," \
              "  messagingSenderId: \"$FIREBASE_WEB_MESSAGING_SENDER_ID\"," \
              "  appId: \"$FIREBASE_WEB_APP_ID\"," \
              "  measurementId: \"$FIREBASE_WEB_MEASUREMENT_ID\"," \
              '};' \
              > web/firebase-web-config.js
          else
            echo "Firebase Web Push secrets are incomplete; Web Push will be disabled for this build."
            echo "self.firebaseWebConfig = {};" > web/firebase-web-config.js
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: >-
          flutter build web
          --release
          --pwa-strategy=none
          --no-web-resources-cdn
          --base-href=/
          --dart-define=PUBLIC_BASE_URL=https://app.pk.management/#
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          --dart-define=FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY
          --dart-define=FIREBASE_WEB_AUTH_DOMAIN=$FIREBASE_WEB_AUTH_DOMAIN
          --dart-define=FIREBASE_WEB_PROJECT_ID=$FIREBASE_WEB_PROJECT_ID
          --dart-define=FIREBASE_WEB_STORAGE_BUCKET=$FIREBASE_WEB_STORAGE_BUCKET
          --dart-define=FIREBASE_WEB_MESSAGING_SENDER_ID=$FIREBASE_WEB_MESSAGING_SENDER_ID
          --dart-define=FIREBASE_WEB_APP_ID=$FIREBASE_WEB_APP_ID
          --dart-define=FIREBASE_WEB_MEASUREMENT_ID=$FIREBASE_WEB_MEASUREMENT_ID
          --dart-define=FIREBASE_WEB_VAPID_KEY=$FIREBASE_WEB_VAPID_KEY

      - name: Enforce web bundle budget
        run: |
          main_js_bytes=$(stat -c%s build/web/main.dart.js)
          echo "main.dart.js: $main_js_bytes bytes"
          if [ "$main_js_bytes" -gt 8000000 ]; then
            echo "main.dart.js exceeded the 8 MB release budget."
            exit 1
          fi

      - name: Configure custom domain
        run: printf 'app.pk.management\n' > build/web/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload-pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Upload build for server deploy
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 3

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout smoke tests
        uses: actions/checkout@v4

      - name: Deploy Pages
        id: deployment
        uses: actions/github-script@v9
        timeout-minutes: 35
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
          PAGES_DEPLOYMENT_TIMEOUT_MS: 1800000
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployPages = require('./.github/scripts/deploy-pages-with-extended-wait.js');
            await deployPages({ github, context, core });

      - name: Smoke test production
        run: bash tool/web_smoke.sh https://app.pk.management

      - name: Install production browser tests
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser smoke
        env:
          WEB_BASE_URL: https://app.pk.management
        run: npm run test:e2e

  deploy-timeweb:
    name: Deploy to Timeweb Cloud
    needs: build
    runs-on: ubuntu-latest
    env:
      TIMEWEB_HOST: ${{ secrets.TIMEWEB_HOST }}
      TIMEWEB_SSH_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}

    steps:
      - name: Check server secrets
        id: gate
        run: |
          if [ -z "$TIMEWEB_HOST" ] || [ -z "$TIMEWEB_SSH_KEY" ]; then
            echo "TIMEWEB_HOST / TIMEWEB_SSH_KEY are not set; skipping server deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Precompress static files (brotli + gzip)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli >/dev/null
          rm -f build/web/CNAME
          find build/web -type f \( -name '*.js' -o -name '*.wasm' -o -name '*.json' -o -name '*.html' -o -name '*.css' -o -name '*.otf' -o -name '*.ttf' -o -name '*.svg' -o -name '*.txt' \) -size +1k \
            -exec brotli -k -f -q 11 {} \; -exec gzip -k -f -9 {} \;
          du -sh build/web
          ls -la build/web/main.dart.js*

      - name: Configure SSH
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$TIMEWEB_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$TIMEWEB_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        if: steps.gate.outputs.enabled == 'true'
        run: |
          release="/var/www/app/releases/${GITHUB_SHA::12}"
          ssh -i ~/.ssh/deploy_key "deploy@$TIMEWEB_HOST" "mkdir -p '$release'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" build/web/ "deploy@$TIMEWEB_HOST:$release/"

      - name: Switch release and prune
        if: steps.gate.outputs.enabled == 'true'
        run: |
          release="/var/www/app/releases/${GITHUB_SHA::12}"
          ssh -i ~/.ssh/deploy_key "deploy@$TIMEWEB_HOST" bash -s <<EOF
            set -e
            ln -sfn "$release" /var/www/app/current.tmp
            mv -T /var/www/app/current.tmp /var/www/app/current
            cd /var/www/app/releases && ls -1dt */ | tail -n +4 | xargs -r rm -rf
            echo "current -> \$(readlink /var/www/app/current)"
          EOF

      - name: Verify server answers for the domain
        if: steps.gate.outputs.enabled == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.pk.management' "http://$TIMEWEB_HOST/")
          echo "HTTP $code from the server for Host: app.pk.management"
          case "$code" in
            200|301|308) ;;
            *) echo "Unexpected status from the server"; exit 1 ;;
          esac
