name: Mobile CI

# Step 61: proves the iOS and Android projects still compile after web-first
# changes. No signing — the IPA/AAB for the stores are built on the Mac with
# scripts/ios_release_build.sh and scripts/android_release_build.sh.
# macOS minutes are expensive, so this runs on demand and on tags only.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=ci 2>&1 | tee ios-build.txt || {
            grep -E "error:|Error" ios-build.txt | head -20 | sed 's/^/::error::/'; exit 1; }

  android:
    name: Android build (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - run: flutter pub get
      - name: Build APK (debug)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=https://example.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=ci 2>&1 | tee android-build.txt || {
            grep -E "error:|FAILURE|Error" android-build.txt | head -20 | sed 's/^/::error::/'; exit 1; }
